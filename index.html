<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/santeo-connect/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SANTEO">
  <meta name="theme-color" content="#0097A7">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>SANTEO Connect</title>
  <style>
    body { margin:0; padding:0; background:#0097A7; }
    flt-glass-pane { position:fixed!important; top:0!important; left:0!important; right:0!important; bottom:0!important; }
  </style>
  <script>
    // Tuer tous les anciens service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      caches.keys().then(function(ks) {
        ks.forEach(function(k) { caches.delete(k); });
      });
    }
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
