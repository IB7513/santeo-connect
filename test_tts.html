<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Test TTS SANTEO</title>
<style>body{font-family:sans-serif;padding:20px;background:#f0f4f8;}
button{display:block;width:100%;padding:16px;margin:8px 0;font-size:16px;border-radius:8px;border:none;cursor:pointer;}
.btn-primary{background:#0097A7;color:white;}
.btn-test{background:#26C6DA;color:white;}
#log{background:#fff;border:1px solid #ddd;padding:12px;border-radius:8px;min-height:120px;font-family:monospace;font-size:13px;white-space:pre-wrap;}
</style></head>
<body>
<h2>🎙️ Diagnostic TTS SANTEO</h2>
<button class="btn-primary" onclick="testDirect()">1. Test speak() DIRECT</button>
<button class="btn-test" onclick="testVoices()">2. Lister les voix dispo</button>
<button class="btn-test" onclick="testFrench()">3. Voix française explicite</button>
<button class="btn-test" onclick="testQueue()">4. Test via __santeoSpeak()</button>
<div id="log">Clique un bouton pour tester...</div>
<script>
var log = document.getElementById('log');
function l(msg) { log.textContent += msg + '\n'; console.log(msg); }

function testDirect() {
  log.textContent = '';
  l('speechSynthesis disponible: ' + !!window.speechSynthesis);
  var u = new SpeechSynthesisUtterance('Bonjour, ceci est un test de la voix française pour SANTEO.');
  u.lang = 'fr-FR'; u.rate = 0.88; u.volume = 1.0;
  u.onstart = function() { l('✅ onstart déclenché !'); };
  u.onerror = function(e) { l('❌ onerror: ' + e.error); };
  u.onend = function() { l('✅ onend — terminé'); };
  window.speechSynthesis.speak(u);
  l('speak() appelé. speaking=' + window.speechSynthesis.speaking + ' pending=' + window.speechSynthesis.pending);
}

function testVoices() {
  log.textContent = '';
  var voices = window.speechSynthesis.getVoices();
  l('Nombre de voix: ' + voices.length);
  for (var i = 0; i < voices.length; i++) {
    l('  [' + i + '] ' + voices[i].name + ' — ' + voices[i].lang + (voices[i].localService ? ' (local)' : ' (réseau)'));
  }
  if (voices.length === 0) {
    l('⚠️ Aucune voix — onvoiceschanged en attente...');
    window.speechSynthesis.onvoiceschanged = function() {
      var v2 = window.speechSynthesis.getVoices();
      l('onvoiceschanged: ' + v2.length + ' voix chargées');
      for (var j = 0; j < v2.length; j++) l('  ' + v2[j].name + ' ' + v2[j].lang);
    };
  }
}

function testFrench() {
  log.textContent = '';
  var voices = window.speechSynthesis.getVoices();
  var fr = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang && voices[i].lang.startsWith('fr')) { fr = voices[i]; break; }
  }
  l('Voix fr trouvée: ' + (fr ? fr.name + ' (' + fr.lang + ')' : 'AUCUNE'));
  var u = new SpeechSynthesisUtterance('Inspirez lentement. Gardez la position vingt secondes.');
  u.lang = 'fr-FR'; u.rate = 0.88; u.volume = 1.0;
  if (fr) u.voice = fr;
  u.onerror = function(e) { l('❌ erreur: ' + e.error); };
  u.onstart = function() { l('✅ voix française en cours...'); };
  window.speechSynthesis.speak(u);
  l('speak() lancé');
}

function testQueue() {
  log.textContent = '';
  if (window.__santeoSpeak) {
    window.__santeoSpeak('Test via la queue SANTEO. La voix fonctionne.');
    l('__santeoSpeak() appelé. Unlocked=' + window.__santeoTtsUnlocked);
  } else {
    l('❌ window.__santeoSpeak non défini (pas sur la page app)');
  }
}
</script>
</body></html>
