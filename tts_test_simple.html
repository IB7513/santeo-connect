<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TTS Simple Test</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; padding:30px; max-width:600px; }
  button { 
    display:block; width:100%; padding:20px; margin:10px 0; 
    font-size:18px; font-weight:bold; cursor:pointer;
    background:#26C6DA; color:#000; border:none; border-radius:12px;
  }
  button:active { background:#00ACC1; }
  #status { 
    background:#000; padding:15px; border-radius:8px; 
    font-family:monospace; font-size:14px; line-height:1.8;
    min-height:150px; white-space:pre-wrap; margin-top:20px;
  }
  .ok  { color:#4CAF50; }
  .err { color:#f44336; }
  .warn{ color:#FF9800; }
</style>
</head>
<body>
<h2>🔊 Test TTS Minimal</h2>
<p style="color:#aaa">Page HTML pure — sans Flutter. Teste si le navigateur accepte speech synthesis.</p>

<button id="btn1" onclick="test1()">▶ CLIQUER ICI → Parler MAINTENANT</button>
<button id="btn2" onclick="test2()">🔍 Diagnostic complet</button>
<button id="btn3" onclick="test3()">🎵 Via AudioContext</button>

<div id="status">En attente de clic...</div>

<script>
var el = document.getElementById('status');

function addLine(txt, cls) {
  var d = document.createElement('div');
  d.className = cls || '';
  d.textContent = txt;
  el.appendChild(d);
  console.log(txt);
}

function clear() { el.innerHTML = ''; }

function test1() {
  clear();
  addLine('Clic reçu !');
  
  if (!window.speechSynthesis) {
    addLine('❌ speechSynthesis non disponible dans ce navigateur', 'err');
    return;
  }
  addLine('✓ speechSynthesis trouvé', 'ok');
  
  // Annuler tout ce qui est en cours
  window.speechSynthesis.cancel();
  
  // Créer l'utterance
  var u = new SpeechSynthesisUtterance('Bonjour ! Je suis SANTEO Connect. Ceci est un test de la voix française.');
  u.lang = 'fr-FR';
  u.rate = 0.9;
  u.pitch = 1.0;
  u.volume = 1.0;
  
  u.onstart = function() { addLine('✅ SON DÉCLENCHÉ — vous devriez entendre la voix !', 'ok'); };
  u.onend   = function() { addLine('✅ Parole terminée normalement', 'ok'); };
  u.onerror = function(e) { addLine('❌ ERREUR : ' + e.error + ' — ' + JSON.stringify(e), 'err'); };
  
  window.speechSynthesis.speak(u);
  
  addLine('→ speak() appelé');
  addLine('  speaking  : ' + window.speechSynthesis.speaking);
  addLine('  pending   : ' + window.speechSynthesis.pending);
  addLine('  paused    : ' + window.speechSynthesis.paused);
  
  // Chrome bug : vérifie si on est bloqué après 500ms
  setTimeout(function() {
    if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
      addLine('⚠️ 500ms plus tard : speaking=false, pending=false', 'warn');
      addLine('  → Chrome a probablement bloqué silencieusement', 'warn');
      addLine('  → Vérifiez : onglet muet ? politique du site ?', 'warn');
    } else {
      addLine('OK : speaking encore actif après 500ms', 'ok');
    }
  }, 500);
}

function test2() {
  clear();
  addLine('=== DIAGNOSTIC COMPLET ===');
  
  // SpeechSynthesis
  addLine('speechSynthesis : ' + (!!window.speechSynthesis ? '✓ présent' : '✗ absent'), window.speechSynthesis ? 'ok' : 'err');
  
  if (window.speechSynthesis) {
    var v = window.speechSynthesis.getVoices();
    addLine('Voix totales : ' + v.length);
    var fr = v.filter(function(x){ return x.lang && x.lang.startsWith('fr'); });
    addLine('Voix fr* : ' + fr.length + (fr.length ? ' ✓' : ' (aucune)'), fr.length ? 'ok' : 'warn');
    if (fr.length) {
      fr.forEach(function(x) { addLine('  • ' + x.name + ' ['+x.lang+']' + (x.localService?' LOCAL':''), 'ok'); });
    }
  }
  
  // AudioContext
  addLine('');
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    addLine('AudioContext : ✓ disponible', 'ok');
    addLine('  state : ' + ctx.state, ctx.state==='running'?'ok':'warn');
    ctx.close();
  } catch(e) {
    addLine('AudioContext : ✗ ' + e.message, 'err');
  }
  
  // User Activation
  addLine('');
  if (navigator.userActivation) {
    addLine('userActivation.isActive      : ' + navigator.userActivation.isActive, navigator.userActivation.isActive?'ok':'warn');
    addLine('userActivation.hasBeenActive : ' + navigator.userActivation.hasBeenActive, navigator.userActivation.hasBeenActive?'ok':'warn');
  } else {
    addLine('userActivation : non supporté (OK, ce n\'est pas bloquant)', 'warn');
  }
  
  // Notifications / permissions
  addLine('');
  addLine('document.hidden : ' + document.hidden);
  addLine('visibilityState : ' + document.visibilityState);
  addLine('userAgent       : ' + navigator.userAgent.substring(0,80));
}

function test3() {
  clear();
  addLine('Test via AudioContext...');
  
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    addLine('AudioContext créé, state : ' + ctx.state);
    
    ctx.resume().then(function() {
      addLine('AudioContext.resume() → state : ' + ctx.state, ctx.state==='running'?'ok':'err');
      
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance('AudioContext actif. SANTEO parle !');
      u.lang = 'fr-FR'; u.rate = 0.9; u.volume = 1.0;
      u.onstart = function() { addLine('✅ SON via AudioContext !', 'ok'); };
      u.onerror = function(e) { addLine('❌ ' + e.error, 'err'); };
      window.speechSynthesis.speak(u);
      addLine('→ speak() après resume(). Vous devriez entendre...');
      
    }).catch(function(e) {
      addLine('❌ resume() échec : ' + e, 'err');
    });
  } catch(e) {
    addLine('❌ AudioContext : ' + e, 'err');
  }
}
</script>
</body>
</html>
